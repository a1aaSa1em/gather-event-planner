AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Gather event planner with authenticated accounts and a serverless AWS backend.
Parameters:
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email for API error alerts; confirm the SNS subscription.
Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
Resources:
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub 'https://${SiteDistribution.DomainName}/'
      LogoutURLs:
        - !Sub 'https://${SiteDistribution.DomainName}/'
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'gather-${AWS::AccountId}-${AWS::Region}'
      UserPoolId: !Ref UserPool
  EventsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type', 'authorization']
        AllowMethods: [GET, POST, PATCH, OPTIONS]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            AuthorizationScopes: [openid]
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
              audience:
                - !Ref UserPoolClient
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref EventsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:Query', 'dynamodb:UpdateItem']
              Resource: !GetAtt EventsTable.Arn
      Events:
        ListEvents:
          Type: HttpApi
          Properties: {ApiId: !Ref EventsApi, Path: /events, Method: GET}
        CreateEvent:
          Type: HttpApi
          Properties: {ApiId: !Ref EventsApi, Path: /events, Method: POST}
        ListTasks:
          Type: HttpApi
          Properties: {ApiId: !Ref EventsApi, Path: '/events/{eventId}/tasks', Method: GET}
        CreateTask:
          Type: HttpApi
          Properties: {ApiId: !Ref EventsApi, Path: '/events/{eventId}/tasks', Method: POST}
        UpdateTask:
          Type: HttpApi
          Properties: {ApiId: !Ref EventsApi, Path: '/events/{eventId}/tasks/{taskId}', Method: PATCH}
  ErrorNotifications:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
  ErrorSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref ErrorNotifications
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gather API returned at least one server error in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref EventsApi
        - Name: Stage
          Value: '$default'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref ErrorNotifications], !Ref 'AWS::NoValue']
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  SiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-access'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccess.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'
Outputs:
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  CognitoClientId:
    Value: !Ref UserPoolClient
  UserPoolId:
    Value: !Ref UserPool
  ApiUrl:
    Value: !Sub 'https://${EventsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  WebsiteUrl:
    Value: !Sub 'https://${SiteDistribution.DomainName}'
